{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card__title">Welcome back 👋</div>
    <div class="auth-card__subtitle">Login to find your gaming partner</div>

    <form method="POST" action="{{ url_for('auth.login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control"
               placeholder="your@email.com" required
               value="{{ form_data.email if form_data else '' }}">
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control"
               placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:0.5rem;">
        Login
      </button>
    </form>

    <div class="auth-card__footer">
      Don't have an account? <a href="{{ url_for('auth.register') }}">Register</a>
    </div>
  </div>
</div>
{% endblock %}
